name: More Magic Solutions
description: >-
  More Magic Solutions (MoreMagic Solutions) was a mobile commerce and mobile
  money company that enabled mobile operators, financial institutions, content
  providers, and distributors to let consumers purchase goods and services on
  demand via a mobile phone, POS, or the web, with deployments across more than
  30 countries. Backed by Battery Ventures, Cipio Partners, DN Capital, Endeavour
  Vision, and others, the company was acquired by Oberthur Technologies in
  February 2012 and folded into Oberthur's mobile financial services offering. It
  no longer operates as an independent entity: the moremagic.com domain is now
  parked/for-sale and the company publishes no active developer portal, API
  reference, or API artifacts. This profile is retained in the API Evangelist
  network as a historical VC-portfolio lead; the enrichment pass found no live
  API surface to harvest.
